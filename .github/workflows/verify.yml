name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.2.9-alpine@sha256:30abb90e62f14b737010746def3ba99cc79fe19dcdb3d37b41f21fc62e7da19d
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HULK_TEST_REDIS_URL: redis://127.0.0.1:6379
      HULK_REQUIRE_REDIS_TEST: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify lockfile immutability
        run: git diff --exit-code -- package-lock.json
      - name: Dependency audit
        run: npm run audit
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Security contracts
        run: npm run security:contracts

  qualification-package:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Production build from exact PR head
        run: npm run build
      - name: Create rendered qualification overlay
        env:
          QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zip_name="HULK-SA-Web-Player-Phase-5A-Rendered-Qualification-${QUALIFICATION_SHA}.zip"
          rm -rf qualification
          mkdir -p qualification
          cp -R dist qualification/dist
          find qualification/dist -type f \
            \( -name '*.d.ts' -o -name '*.d.ts.map' -o -name '*.js.map' \) -delete
          if find qualification/dist -type f \
            \( -name '*.d.ts' -o -name '*.d.ts.map' -o -name '*.js.map' \) | grep -q .; then
            echo "qualification overlay contains non-runtime build metadata" >&2
            exit 1
          fi
          (
            cd qualification
            zip -X -q -r "../${zip_name}" dist
          )
          sha256sum "${zip_name}" | tee "${zip_name}.sha256"
      - name: Upload rendered qualification overlay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase-5a-rendered-qualification-${{ github.event.pull_request.head.sha }}
          path: |
            HULK-SA-Web-Player-Phase-5A-Rendered-Qualification-${{ github.event.pull_request.head.sha }}.zip
            HULK-SA-Web-Player-Phase-5A-Rendered-Qualification-${{ github.event.pull_request.head.sha }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
